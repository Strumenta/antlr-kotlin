name: Build

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - '**/README.md'
      - '**/.editorconfig'
      - '**/.gitignore'
  pull_request:
    branches: [ 'master' ]
    paths-ignore:
      - '**/README.md'
      - '**/.editorconfig'
      - '**/.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - java: '17'
            target: Gradle Plugin
            task: ':antlr-kotlin-gradle-plugin:check'
          - java: '11'
            target: JVM
            task: jvmTest
          - java: '17'
            target: JVM
            task: jvmTest
          - java: '17'
            target: JS
            task: jsTest
          - java: '17'
            target: wasmJS
            task: wasmJsTest
          - java: '17'
            target: WASI
            task: wasmWasiTest
    runs-on: ubuntu-latest
    name: Build (${{ matrix.java }} / ${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
      - name: Cache Konan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ github.sha }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Run Build and Tests (${{ matrix.target }})
        run: ./gradlew ${{ matrix.task }}
        working-directory: ${{ github.workspace }}
        continue-on-error: false
